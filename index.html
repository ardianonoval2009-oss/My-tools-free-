<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tools FREE - 100% Gratis</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white p-4">
<div class="max-w-4xl mx-auto">
<h1 class="text-3xl font-black mt-6">My Tools <span class="text-purple-500">FREE</span></h1>
<p class="text-gray-400 text-sm">100% Free, No Premium, No Login</p>

<div class="grid grid-cols-2 gap-3 mt-8">
<button onclick="openTool('qr')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl font-bold">QR Generator</button>
<button onclick="openTool('compress')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl font-bold">Compress Foto</button>
<button onclick="openTool('word')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl font-bold">Word Counter</button>
<button onclick="openTool('pass')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl font-bold">Password Gen</button>
</div>

<div id="box" class="bg-zinc-900 border border-zinc-800 mt-6 p-6 rounded-[20px] hidden"></div>
<p class="text-center text-zinc-600 text-xs mt-10">By Ardian • Free Forever</p>
</div>

<script>
function openTool(t){
let b=document.getElementById('box');b.classList.remove('hidden');b.scrollIntoView({behavior:'smooth'});
if(t=='qr')b.innerHTML=`<h2 class='text-xl font-bold'>QR Generator FREE</h2><input id='q' placeholder='Link / WA / Teks' class='w-full mt-4 p-3 rounded-xl bg-black border border-zinc-700 outline-none'><button onclick="document.getElementById('qrimg').src='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+encodeURIComponent(document.getElementById('q').value)" class='mt-3 bg-purple-600 p-3 w-full rounded-xl font-bold'>Generate QR</button><img id='qrimg' class='mt-4 mx-auto bg-white p-2 rounded-xl w-60'>`;
if(t=='word')b.innerHTML=`<h2 class='font-bold'>Word Counter</h2><textarea id='txt' rows='6' placeholder='Paste teks...' class='w-full mt-3 p-3 rounded-xl bg-black border border-zinc-700'></textarea><p id='wc' class='mt-2 text-sm text-gray-400'></p>`+`<script>document.getElementById('txt').oninput=e=>{let v=e.target.value;document.getElementById('wc').innerText='Kata: '+(v.trim()?v.trim().split(/\\s+/).length:0)+' | Karakter: '+v.length}<\/script>`;
if(t=='pass')b.innerHTML=`<h2 class='font-bold'>Password Generator</h2><p id='p' class='mt-4 p-4 bg-black rounded-xl font-mono border border-zinc-800'>Klik Generate</p><button onclick="document.getElementById('p').innerText=Math.random().toString(36).slice(2)+Math.random().toString(36).toUpperCase().slice(2)+'!@#'" class='mt-3 bg-purple-600 w-full p-3 rounded-xl font-bold'>Generate Strong Password</button>`;
if(t=='compress')b.innerHTML=`<h2 class='font-bold'>Compress Foto - 100% di HP</h2><input type='file' id='f' accept='image/*' class='mt-4'><canvas id='c' class='hidden'></canvas><button onclick="let file=document.getElementById('f').files[0];let img=new Image();img.src=URL.createObjectURL(file);img.onload=()=>{let c=document.getElementById('c');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed-free.jpg';a.click()},'image/jpeg',0.6)}" class='mt-4 bg-purple-600 w-full p-3 rounded-xl font-bold'>Compress & Download</button>`;
}
</script>
</body>
</html>
